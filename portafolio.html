{% include header.html %}

<!-- Hero -->
<section class="dip text-light d-flex align-items-center">
  <div class="container">
    <h2 class="wt display-4 fw-bold">Portafolio de Diseños</h2>
    <p class="wt">¿Qué podremos ser capaces de hacer?</p>
  </div>
</section>


<!-- Filtro -->
<div class="navbar navbar-expand-lg navbar-dark stronger py-5">
  <div class="container">

    <div class="container my-4 text-center text-light">

      <label for="filtroInstitucion" class="float-start form-label">
        Filtrar por institución
      </label>

      <select id="filtroInstitucion" class="form-select w-auto mx-auto">
        <option value="ismemcarrera">IESTP Maria Elena Moyano (carrera)</option>
        <option value="ismemtaller">IESTP Maria Elena Moyano (talleres)</option>
        <option value="as">IEP American Systems</option>
        <option value="lcpf">La Casa de Plantas y Flores</option>
        <option value="nsr">IEP Nuestra Señora del Rosario</option>
        <option value="ayphu">Ayphu</option>
        <option value="jct">IEP Julio C. Tello</option>
        <option value="externos">Diseños externos</option>
        <option value="otros">Otros ejemplos</option>
      </select>

    </div>

  </div>
</div>


<!-- Contenido -->
<section class="grs">
  <div class="container">
    <div id="contenedorGaleria">
      <div class="galeria-masonry">

        {% include ismem-carreras.html %}
        {% include ismem-talleres.html %}
        {% include american-system.html %}
        {% include la-casa-plantas-y-flores.html %}
        {% include disenios.html %}

      </div>
    </div>

    <!-- Modal -->
    <div class="modal fade"
         id="galeriaModal"
         tabindex="-1"
         aria-hidden="true">

      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content bg-transparent border-0">
          <div class="modal-body text-center">
            <img id="imagenModal"
                 class="img-fluid rounded">
          </div>
        </div>
      </div>
    </div>
  </div>

</section>

{% include footer.html %}

<script>
    document.addEventListener('DOMContentLoaded', function () {

        const select = document.getElementById('filtroInstitucion');
        const items = document.querySelectorAll('.galeria-item');
        const galeria = document.getElementById('contenedorGaleria');

        if (!select) {
            console.error('No se encontró #filtroInstitucion');
            return;
        }

        if (!galeria) {
            console.error('No se encontró #contenedorGaleria');
            return;
        }

        function aplicarFiltro(filtro) {

            if (filtro === '') {
                items.forEach(function (item) {
                    item.classList.add('oculto');
                });

                galeria.classList.add('galeria-oculta');
                return;
            }

            galeria.classList.remove('galeria-oculta');
            items.forEach(function (item) {
                const institucion = item.dataset.institucion;

                if (institucion === filtro) {
                    item.classList.remove('oculto');
                } else {
                    item.classList.add('oculto');
                }
            });
        }

        const filtroInicial = 'ismemcarrera';
        select.value = filtroInicial;
        aplicarFiltro(filtroInicial);

        select.addEventListener('change', function () {
            aplicarFiltro(this.value);
        });

        const modal = document.getElementById('galeriaModal');

        if (modal) {
            modal.addEventListener('show.bs.modal', function (event) {
                const img = event.relatedTarget;
                if (!img) {
                    return;
                }
                const src = img.getAttribute('data-img');
                const imagenModal =
                    document.getElementById('imagenModal');

                if (imagenModal && src) {
                    imagenModal.src = src;
                }
            });
        }
    });
</script>
